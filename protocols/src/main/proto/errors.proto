syntax = "proto3";

package proxiya.errors;

option java_package = "ru.despectra.proxiya.proto.errors";
option java_multiple_files = true;

enum ErrorType {
  // default value
  ERROR_UNSPECIFIED = 0;

  // Просто какая-то неизвестная внутренняя ошибка
  INTERNAL_ERROR = 1;

  // Порт для прокси уже занят
  PROXY_PORT_ALREADY_IN_USE = 2;

  // Недостаточно параметров прокси (при создании/обновлении)
  PROXY_PARAMS_INCOMPLETE = 3;

  // Неверные параметры прокси (при создании/обновлении)
  PROXY_PARAMS_INVALID = 4;

  // Прокси с таким ID не найден
  PROXY_NOT_FOUND = 5;

  // Не удалось запустить прокси
  PROXY_STARTUP_FAILURE = 6;

  // Не удалось остановить прокси
  PROXY_SHUTDOWN_FAILURE = 7;
}

message GenericError {
  optional ErrorType type = 1;
  optional string error_message = 2;
}