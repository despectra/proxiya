syntax = "proto3";

package ru.despectra.proxiya.proto.control;

import "control/controller.proto";
import "common_types.proto";
import "proxy.proto";

// Сервис для управления прокси (используется UI и внешними клиентами)
service ProxyManagementService {
  // Создание нового прокси с заданными параметрами
  rpc CreateProxy(
      ru.despectra.proxiya.proto.common.ProxyParams
  ) returns (
      ru.despectra.proxiya.proto.common.ProxyInstance
  );
  
  // Запуск прокси по ID
  rpc StartProxy(StartProxyRequest) returns (
      ru.despectra.proxiya.proto.common.OperationResult
  );
  
  // Остановка прокси по ID
  rpc StopProxy(StopProxyRequest) returns (
      ru.despectra.proxiya.proto.common.OperationResult
  );
  
  // Стриминг списка прокси (обновления в реальном времени)
  rpc StreamProxies(StreamProxiesRequest) returns (stream ProxiesList);
  
  // Получение общего статуса контроллера
  rpc GetControllerStatus(GetControllerStatusRequest) returns (ControllerStatus);
  
  // Удаление прокси (остановка + удаление из списка)
  rpc DeleteProxy(DeleteProxyRequest) returns (
      ru.despectra.proxiya.proto.common.OperationResult
  );
}

// Запрос на запуск прокси
message StartProxyRequest {
  string proxy_id = 1;
}

// Запрос на остановку прокси
message StopProxyRequest {
  string proxy_id = 1;
}

// Запрос на стриминг прокси
message StreamProxiesRequest {}

// Список всех имеющихся прокси
message ProxiesList {
  repeated ru.despectra.proxiya.proto.common.ProxyInstance proxy = 1;
}

// Запрос на получение статуса контроллера
message GetControllerStatusRequest {}

// Запрос на удаление прокси
message DeleteProxyRequest {
  string proxy_id = 1;
}

