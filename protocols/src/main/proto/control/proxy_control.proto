syntax = "proto3";

package ru.despectra.proxiya.proto.control;

// Статус прокси
enum ProxyStatus {
  PROXY_STATUS_UNKNOWN = 0;
  PROXY_STATUS_STOPPED = 1;
  PROXY_STATUS_STARTING = 2;
  PROXY_STATUS_RUNNING = 3;
  PROXY_STATUS_STOPPING = 4;
  PROXY_STATUS_ERROR = 5;
}

// Тип прокси
enum ProxyType {
  PROXY_HTTPS = 0;
  PROXY_SOCKS_5 = 1;
}

// Параметры для создания прокси
message ProxyConfig {
  // ID прокси (генерируется автоматически или задается пользователем)
  string proxy_id = 1;

  // Имя прокси
  string proxy_name = 2;
  
  // Порт для прокси
  int32 port = 3;

  // Тип прокси
  ProxyType proxy_type = 4;
  
  // Дополнительные параметры запуска mitmproxy
  repeated string mitmproxy_args = 5;
  
  // Настройки gRPC подключения к контроллеру
  optional GrpcConfig grpc_config = 6;
}

// Настройки gRPC подключения
message GrpcConfig {
  // Хост контроллера
  string host = 1;
  
  // Порт контроллера
  int32 port = 2;
  
  // Использовать TLS
  optional bool use_tls = 3;
}

// Информация о прокси
message ProxyInfo {
  // ID прокси
  string proxy_id = 1;
  
  // Порт прокси
  int32 port = 2;

  // human readable имя прокси сервера
  string proxy_name = 3;

  // Тип прокси
  ProxyType proxy_type = 4;
  
  // Статус прокси
  ProxyStatus status = 5;
  
  // PID процесса (если запущен)
  optional int32 pid = 6;
  
  // Время создания
  int64 created_at = 7;
  
  // Время последнего обновления статуса
  int64 last_updated = 8;
  
  // Ошибка (если есть)
  optional string error_message = 9;
  
  // Оригинальная команда запуска
  optional string command = 10;
}

// Общий статус контроллера
message ControllerStatus {
  // Статус контроллера
  ControllerState state = 1;
  
  // Количество активных прокси
  int32 active_proxies_count = 2;
  
  // Список всех прокси
  repeated ProxyInfo proxies = 3;
  
  // Время последнего обновления
  int64 last_updated = 4;
  
  // Версия контроллера
  optional string version = 5;
}

// Состояние контроллера
enum ControllerState {
  CONTROLLER_STATE_UNKNOWN = 0;
  CONTROLLER_STATE_STARTING = 1;
  CONTROLLER_STATE_RUNNING = 2;
  CONTROLLER_STATE_STOPPING = 3;
  CONTROLLER_STATE_STOPPED = 4;
  CONTROLLER_STATE_ERROR = 5;
}
