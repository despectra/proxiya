syntax = "proto3";

package proxiya.data.http;

option java_package = "ru.despectra.proxiya.proto.data.http";
option java_multiple_files = true;

// HTTP контент с метаданными
message HttpContent {
  // Тело контента
  optional bytes body = 1;
  
  // Размер тела в байтах
  optional int64 content_length = 2;
  
  // MIME тип контента
  optional string content_type = 3;
  
  // Кодировка контента (gzip, deflate, br, etc.)
  optional string content_encoding = 4;
  
  // Способ передачи (chunked, etc.)
  optional string transfer_encoding = 5;
}

// URL и его компоненты
message HttpUrl {
  // Полный URL
  optional string full_url = 1;
  
  // Scheme (http/https)
  optional string scheme = 2;
  
  // Host
  optional string host = 3;
  
  // Port
  optional int32 port = 4;
  
  // Path (без query параметров)
  optional string path = 5;
  
  // Query параметры
  map<string, string> query_params = 6;
  
  // Fragment (часть после #)
  optional string fragment = 7;
}

// HTTP запрос
message HttpRequest {
  // URL запроса
  optional HttpUrl url = 1;
  
  // HTTP метод (GET, POST, etc.)
  optional string method = 2;
  
  // HTTP версия (1.0, 1.1, 2, 3)
  optional string http_version = 3;
  
  // Заголовки запроса
  map<string, string> headers = 4;
  
  // Контент запроса
  optional HttpContent content = 5;
}

// HTTP ответ
message HttpResponse {
  // Статус код ответа (200, 404, etc.)
  optional int32 status_code = 1;

  // HTTP версия (1.0, 1.1, 2, 3)
  optional string http_version = 2;

  // Причина ответа ("OK", "Not Found", etc.)
  optional string reason_phrase = 3;
  
  // Заголовки ответа
  map<string, string> headers = 4;
  
  // Контент ответа
  optional HttpContent content = 5;
}
