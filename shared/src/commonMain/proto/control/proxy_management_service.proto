syntax = "proto3";

package ru.despectra.proxiya.control;

import "control/proxy_control.proto";
import "common_types.proto";

// Сервис для управления прокси (используется UI и внешними клиентами)
service ProxyManagementService {
  // Создание нового прокси с заданными параметрами
  rpc CreateProxy(ProxyConfig) returns (ProxyInfo);
  
  // Запуск прокси по ID
  rpc StartProxy(StartProxyRequest) returns (ProxyInfo);
  
  // Остановка прокси по ID
  rpc StopProxy(StopProxyRequest) returns (ProxyInfo);
  
  // Получение информации о прокси по ID
  rpc GetProxy(GetProxyRequest) returns (ProxyInfo);
  
  // Получение списка всех прокси
  rpc ListProxies(ListProxiesRequest) returns (ListProxiesResponse);
  
  // Получение общего статуса контроллера
  rpc GetControllerStatus(GetControllerStatusRequest) returns (ControllerStatus);
  
  // Удаление прокси (остановка + удаление из списка)
  rpc DeleteProxy(DeleteProxyRequest) returns (Empty);
}

// Запрос на запуск прокси
message StartProxyRequest {
  string proxy_id = 1;
}

// Запрос на остановку прокси
message StopProxyRequest {
  string proxy_id = 1;
}

// Запрос на получение информации о прокси
message GetProxyRequest {
  string proxy_id = 1;
}

// Запрос на получение списка прокси
message ListProxiesRequest {
  // Фильтр по статусу (опционально)
  optional ProxyStatus status_filter = 1;
}

// Ответ со списком прокси
message ListProxiesResponse {
  repeated ProxyInfo proxies = 1;
}

// Запрос на получение статуса контроллера
message GetControllerStatusRequest {
  // Пустой запрос
}

// Запрос на удаление прокси
message DeleteProxyRequest {
  string proxy_id = 1;
}

