syntax = "proto3";

package proxiya.proxy;

option java_package = "ru.despectra.proxiya.proto.proxy";
option java_multiple_files = true;

import "errors.proto";
import "common_types.proto";
import "google/protobuf/timestamp.proto";

// Протки для описания прокси - параметры, созданные прокси-серверы и прочее

enum ProxyType {
  PROXY_TYPE_UNSPECIFIED = 0;
  PROXY_TYPE_HTTP = 1;
  PROXY_TYPE_SOCKS5 = 2;
  PROXY_TYPE_UPSTREAM = 3;
  PROXY_TYPE_TRANSPARENT = 4;
  PROXY_TYPE_REVERSE = 5;
}

// Параметры прокси
message ProxyParams {
  optional string name = 1;
  optional ProxyType type = 2;
  optional int32 port = 3;
  
  // Параметры по типу прокси
  oneof proxy_params {
    UpstreamProxyParams upstream_proxy_params = 4;
    ReverseProxyParams reverse_proxy_params = 5;
    TransparentProxyParams transparent_proxy_params = 6;
  }

  // Дополнительные параметры
  repeated string hosts_whitelist = 11;
  repeated string hosts_blacklist = 12;
  repeated string extra_cmd_params = 13;
  optional bool autostart = 14;
}

message UpstreamProxyParams {
  optional proxiya.common.Endpoint destination = 1;
}

message ReverseProxyParams {
  repeated proxiya.common.Endpoint destinations = 1;
}

message TransparentProxyParams {}

// Созданный экземпляр прокси-сервера
message ProxyInstance {
  // Уникальный идентификатор прокси-сервера
  optional string proxy_id = 1;
  // Параметры прокси
  optional ProxyParams params = 2;
  // Статус работы прокси-сервера
  optional ProxyOperationStatus operation_status = 3;
  // Статус стриминга событий прокси-сервера
  optional ProxyStreamingStatus streaming_status = 4;
  
  // пропуск для объектов на будущее

  // Таймштампы создания и обновления прокси-сервера
  optional google.protobuf.Timestamp created_at = 10;
  optional google.protobuf.Timestamp updated_at = 11;
}

message ProxyOperationStatus {
  ProxyOperationState state = 1;
  optional int32 process_id = 2;
  optional GenericError error = 3;
}

enum ProxyOperationState {
  PROXY_STATE_UNSPECIFIED = 0;
  PROXY_STATE_IDLE = 1;
  PROXY_STATE_STARTING = 2;
  PROXY_STATE_ACTIVE = 3;
  PROXY_STATE_STOPPING = 4;
  PROXY_STATE_ERROR = 5;
}

message ProxyStreamingStatus {
  bool is_streaming_proxy_events = 1;
  optional GenericError error = 2;
}