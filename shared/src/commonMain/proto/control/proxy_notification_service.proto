syntax = "proto3";

package ru.despectra.proxiya.control;

import "control/proxy_control.proto";
import "common_types.proto";

// Сервис для уведомлений от mitmproxy аддонов
service ProxyNotificationService {
  // Оповещение контроллера о запуске прокси (вызывается из mitmproxy аддона)
  rpc NotifyProxyStarted(NotifyProxyStartedRequest) returns (Empty);
  
  // Оповещение контроллера об остановке прокси (вызывается из mitmproxy аддона)
  rpc NotifyProxyStopped(NotifyProxyStoppedRequest) returns (Empty);
  
  // Оповещение об ошибке в работе прокси
  rpc NotifyProxyError(NotifyProxyErrorRequest) returns (Empty);
  
  // Периодическое уведомление о том, что прокси еще жив (heartbeat)
  rpc Heartbeat(HeartbeatRequest) returns (Empty);
}

// Оповещение о запуске прокси
message NotifyProxyStartedRequest {
  string proxy_id = 1;
  int32 pid = 2;
  // Дополнительная информация о запуске
  optional string startup_info = 3;
}

// Оповещение об остановке прокси
message NotifyProxyStoppedRequest {
  string proxy_id = 1;
  int32 exit_code = 2;
  // Причина остановки
  optional string reason = 3;
}

// Оповещение об ошибке в работе прокси
message NotifyProxyErrorRequest {
  string proxy_id = 1;
  string error_message = 2;
  // Тип ошибки
  string error_type = 3;
  // Дополнительные детали
  map<string, string> error_details = 4;
}

// Heartbeat от прокси
message HeartbeatRequest {
  string proxy_id = 1;
  // Статистика работы прокси
  optional ProxyStats stats = 2;
}

// Статистика работы прокси
message ProxyStats {
  // Количество обработанных запросов
  int64 requests_processed = 1;
  
  // Количество обработанных ответов
  int64 responses_processed = 2;
  
  // Время последней активности
  int64 last_activity = 3;
  
  // Использование памяти (в байтах)
  optional int64 memory_usage = 4;
}

