syntax = "proto3";

package proxiya.common;

option java_package = "ru.despectra.proxiya.proto.common";
option java_multiple_files = true;

import "errors.proto";

message OperationResult {
  optional bool success = 1;
  optional proxiya.errors.GenericError error = 2;
}

message Endpoint {
  optional string host = 1;
  optional int32 port = 2;
  optional string scheme = 3;
}