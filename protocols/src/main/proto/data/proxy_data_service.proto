syntax = "proto3";

package proxiya.service.data;

option java_package = "ru.despectra.proxiya.proto.service.data";
option java_multiple_files = true;

import "data/interception_data.proto";

// Сервис для стриминга перехваченных запросов и ответов из контроллера в UI-приложение
// Данный сервис вызывается из UI-приложения
service ProxyDataService {
  // Стриминг перехваченных запросов из контроллера в UI-приложение
  rpc StreamInterceptedRequests(
    stream proxiya.data.interception.RequestProcessingResult
  ) returns (stream proxiya.data.interception.InterceptedRequestNotification);

  // Стриминг перехваченных ответов из контроллера в UI-приложение
  rpc StreamInterceptedResponses(
    stream proxiya.data.interception.ResponseProcessingResult
  ) returns (stream proxiya.data.interception.InterceptedResponseNotification);
}
